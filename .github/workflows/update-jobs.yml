name: Refresh job listings

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */5 * * *"

concurrency:
  group: pythoncareers-job-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger the protected production updater
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/update-jobs/"
