name: Refresh job listings

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: mena-tech-careers-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Trigger the protected production updater
        env:
          SITE_URL: https://menatechcareers.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$SITE_URL"
          test -n "$CRON_SECRET"
          curl --fail --show-error --silent \
            --max-time 300 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/update-jobs/"
      - name: Send tailored job alerts in batches
        env:
          SITE_URL: https://menatechcareers.vercel.app
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for batch in 1 2 3 4; do
            curl --fail --show-error --silent \
              --max-time 120 \
              --header "Authorization: Bearer $CRON_SECRET" \
              "${SITE_URL%/}/api/cron/send-alerts/"
          done
